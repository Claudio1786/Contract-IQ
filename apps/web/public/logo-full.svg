<svg width="400" height="80" viewBox="0 0 400 80" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Document icon with gradient -->
    <g transform="translate(0, 10)">
        <!-- Main document -->
        <rect width="45" height="60" rx="6" fill="url(#doc-gradient)" stroke="url(#doc-border)" stroke-width="1.5"/>
        
        <!-- Folded corner -->
        <path d="M30 0L45 15L30 15V0Z" fill="rgba(255,255,255,0.3)"/>
        
        <!-- Gradient text lines -->
        <rect x="10" y="25" width="25" height="2.5" rx="1.25" fill="url(#line-1)"/>
        <rect x="10" y="32" width="25" height="2.5" rx="1.25" fill="url(#line-2)"/>
        <rect x="10" y="39" width="18" height="2.5" rx="1.25" fill="url(#line-3)"/>
        
        <!-- AI spark icon -->
        <circle cx="22.5" cy="50" r="3" fill="url(#spark)"/>
        <path d="M22.5 44L22.5 46M22.5 54L22.5 56M16.5 50L18.5 50M26.5 50L28.5 50" stroke="url(#spark)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Text: Contract IQ -->
    <text x="65" y="50" font-family="system-ui,-apple-system,Inter,sans-serif" font-size="32" font-weight="700" fill="#0f172a">
        Contract
    </text>
    <text x="225" y="50" font-family="system-ui,-apple-system,Inter,sans-serif" font-size="32" font-weight="700" fill="url(#text-gradient)">
        IQ
    </text>
    
    <defs>
        <linearGradient id="doc-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6"/>
            <stop offset="100%" style="stop-color:#2563EB"/>
        </linearGradient>
        <linearGradient id="doc-border" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4"/>
            <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.1"/>
        </linearGradient>
        <linearGradient id="line-1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.8"/>
            <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.8"/>
        </linearGradient>
        <linearGradient id="line-2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.6"/>
            <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.6"/>
        </linearGradient>
        <linearGradient id="line-3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.5"/>
            <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.5"/>
        </linearGradient>
        <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8B5CF6"/>
            <stop offset="100%" style="stop-color:#3B82F6"/>
        </linearGradient>
        <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#3B82F6"/>
            <stop offset="100%" style="stop-color:#8B5CF6"/>
        </linearGradient>
    </defs>
</svg>
